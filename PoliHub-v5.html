<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#103c37" />
    <title>PoliHub · 정치학 비교연구 데이터 허브</title>
    <style>* {
  box-sizing: border-box;
}
:root {
  --ink: #182e29;
  --muted: #51655e;
  --green: #164f43;
  --line: #d8e0d8;
  --paper: #f7f8f3;
  --soft: #eaf0e8;
  --serif: "Noto Serif CJK KR", "Noto Serif KR", Batang, Georgia, serif;
  --sans:
    "Inter", "Pretendard", -apple-system, BlinkMacSystemFont,
    "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
  word-break: keep-all;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.45;
  cursor: default;
}
a {
  color: var(--green);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid #d5873c;
  outline-offset: 3px;
}
button {
  border: 0;
  background: none;
}
.wrap {
  width: min(1240px, calc(100% - 96px));
  margin: auto;
}
.top {
  background: #fcfdf9;
  border-bottom: 1px solid var(--line);
}
.bar {
  height: 73px;
  display: flex;
  align-items: center;
  gap: 44px;
}
.brand,
.foot-brand {
  font-family: Georgia, serif;
  font-weight: 700;
  letter-spacing: -1.6px;
  color: #163f36;
  font-size: 32px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}
.brand:hover {
  text-decoration: none;
}
.brandmark {
  display: flex;
  align-items: center;
  gap: 3px;
  transform: skewY(-12deg);
  height: 30px;
}
.brandmark i {
  height: 25px;
  width: 7px;
  background: #235e4e;
  border-radius: 1px;
}
.brandmark i:nth-child(2) {
  height: 30px;
  background: #61917e;
}
.brandmark i:last-child {
  height: 22px;
  background: #c48149;
}
.bar nav {
  height: 100%;
  display: flex;
  gap: 27px;
}
.bar nav a {
  height: 100%;
  display: flex;
  align-items: center;
  border-bottom: 3px solid transparent;
  margin-top: 1px;
  font-weight: 600;
  color: #5d6d64;
  font-size: 14px;
}
.bar nav a.active {
  border-color: #2d6452;
  color: #143e32;
}
.tray {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #bdcfc1;
  border-radius: 7px;
  background: #f4f7ef;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 650;
}
.tray b {
  min-width: 22px;
  background: #e0eadc;
  border-radius: 5px;
  color: #285440;
}
.icon {
  width: 19px;
  height: 19px;
  display: inline-block;
  vertical-align: middle;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linejoin: round;
  stroke-linecap: round;
  fill: none;
  flex-shrink: 0;
}
.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 12px;
  background: #103c37;
  color: #f7f5e8;
  margin: 27px 0 28px;
  display: flex;
  min-height: 300px;
}
.hero-copy {
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 2;
  width: 61%;
  padding: 30px 0 31px 42px;
  pointer-events: none;
}
.hero h1 {
  font-family: var(--serif);
  font-size: clamp(34px, 3.45vw, 53px);
  font-weight: 700;
  line-height: 1.22;
  letter-spacing: -2.8px;
  margin: 0;
}
.hero h1 span {
  display: block;
}
.hero p {
  font-size: 14px;
  color: #d8e8de;
  line-height: 1.75;
  margin: 13px 0 22px;
}
.search {
  background: #fff;
  display: flex;
  align-items: center;
  width: min(565px, 100%);
  padding: 5px 5px 5px 15px;
  border: 1px solid #c1d0c6;
  border-radius: 7px;
  gap: 11px;
  pointer-events: auto;
  box-shadow: 0 3px 6px #082d231e;
}
.search .icon {
  color: #497667;
}
.search input {
  border: 0;
  min-width: 25px;
  flex: 1;
  background: none;
  color: #152f26;
  padding: 7px 0;
  font-size: 14px;
  outline-offset: 0;
}
.search input::placeholder {
  color: #64756b;
}
.search button,
.primary {
  color: white;
  background: #26614e;
  border: 1px solid #2d6353;
  font-weight: 650;
  border-radius: 5px;
  padding: 8px 18px;
}

.hero-map:before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    #103c37 0%,
    #103c37a8 10%,
    transparent 36%
  );
  pointer-events: none;
}
.map-pin {
  position: absolute;
  transform: translate(-5px, -50%);
  padding: 2px 4px;
  line-height: 1.3;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: #fff;
  font-weight: 650;
  white-space: nowrap;
  text-shadow: 0 1px 4px #103d32;
}
.map-pin:before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #f2bf76;
  box-shadow: 0 0 0 3px #eebc7940;
}
.map-pin[data-region="KR"]:before {
  width: 9px;
  height: 9px;
  box-shadow:
    0 0 0 4px #f0bb7650,
    0 0 0 10px #f0bb761b;
}
.map-pin:hover,
.map-pin.is-on {
  color: #ffd08f;
}
.map-credit {
  position: absolute;
  bottom: 10px;
  right: 15px;
  font:
    10px Georgia,
    serif;
  letter-spacing: 0.6px;
  color: #acc4b6;
}
.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 13px;
}
.section-title h2,
h2.page-title {
  font-family: var(--serif);
  font-size: 24px;
  line-height: 1.4;
  letter-spacing: -1.3px;
  margin: 0;
}
.section-title h2 small {
  font: 600 13px var(--sans);
  letter-spacing: 0;
  color: #657a68;
  margin-left: 7px;
}
.fields {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
}
.field {
  min-height: 90px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: left;
  padding: 12px 13px;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  gap: 7px;
  line-height: 1.38;
}
.field .icon {
  color: #326550;
  width: 24px;
  height: 24px;
}
.field[data-field="attitudes"] .icon,
.field[data-field="policy"] .icon {
  color: #956340;
}
.field:hover,
.card:hover {
  border-color: #92af9e;
}
.field.is-on {
  border-color: #336e55;
  background: #e5efe5;
}
.filters {
  margin: 18px 0 25px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
}
.filterline {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: wrap;
}
.filterline > strong {
  font-size: 13px;
  margin-right: 6px;
}
.chip {
  border: 1px solid #d7dfd6;
  padding: 5px 11px;
  border-radius: 17px;
  font-size: 12px;
  line-height: 1.5;
  background: #fff;
  white-space: nowrap;
}
.chip.is-on {
  background: #214e40;
  color: white;
  border-color: #214e40;
}
.morefilter {
  margin-left: auto;
  display: flex;
  gap: 5px;
  align-items: center;
  font-size: 13px;
  color: #325849;
}
.morefilter .icon {
  width: 16px;
}
.filtergrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
  gap: 12px;
  padding: 17px 0 2px;
}
.filtergrid label,
.control {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
}
select,
.form-input,
textarea {
  width: 100%;
  padding: 8px;
  border: 1px solid #bdcdc0;
  border-radius: 5px;
  background: #fff;
  color: var(--ink);
}
.text-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--green);
  font-size: 13px;
  font-weight: 650;
  padding: 4px 0;
}
.text-btn .icon {
  width: 16px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}
.card {
  display: flex;
  flex-direction: column;
  border: 1px solid #d5dfd5;
  border-radius: 9px;
  background: #fff;
  padding: 19px 21px 14px;
  min-width: 0;
}
.cardtop,
.card-end,
.actions,
.work-head {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.cardtop {
  justify-content: space-between;
}
.category {
  font-size: 12px;
  font-weight: 650;
  color: #436a53;
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.category:before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: #85a78b;
}
.category.election:before {
  background: #b78055;
}
.category.legislature:before {
  background: #6f87a3;
}
.category.world:before {
  background: #78846a;
}
.select-data {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  padding: 4px 8px;
  border: 1px solid #d5ded4;
  border-radius: 5px;
  font-size: 12px;
  color: #3d5d4b;
}
.select-data .icon {
  width: 14px;
  height: 14px;
}
.select-data.is-on {
  border-color: #548266;
  background: #e5efe2;
}
.card h3 {
  margin: 9px 0 4px;
  line-height: 1.36;
  font-size: 21px;
  letter-spacing: -0.9px;
}
.card h3 button {
  font: inherit;
  font-weight: 700;
  padding: 0;
  text-align: left;
}
.card p {
  color: #4c5e55;
  font-size: 14px;
  line-height: 1.65;
  margin: 4px 0 14px;
  flex: 1;
}
.card-end {
  justify-content: space-between;
  border-top: 1px solid #e8ece5;
  padding-top: 10px;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 7px;
  color: #5b6c62;
  font-size: 12px;
}
.meta span + span:before {
  content: "·";
  margin-right: 7px;
}
.access {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: #3b5b47;
  font-weight: 680;
  font-size: 12px;
}
.access.direct {
  color: #245f42;
}
.access .icon {
  width: 14px;
  height: 14px;
}
.more-row {
  text-align: center;
  margin: 20px 0;
}
.secondary {
  padding: 8px 13px;
  border: 1px solid #c1cfc3;
  background: #fff;
  border-radius: 5px;
  color: #294e3c;
  font-weight: 600;
}
.primary:hover,
.search button:hover {
  background: #194d3c;
}
.secondary:hover,
.chip:hover:not(.is-on),
.select-data:hover:not(.is-on) {
  background: #f0f4ed;
}
.empty,
.surface {
  padding: 22px 24px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
}
.empty h3,
.surface h3 {
  margin: 0 0 9px;
}
.page-intro {
  margin: 35px 0 19px;
}
.page-intro p,
.hint {
  color: var(--muted);
}
.page-intro p {
  margin: 6px 0;
}
.work-grid {
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(235px, 1.1fr);
  gap: 18px;
}
.surface + .surface,
details + .surface,
.work-grid + .surface {
  margin-top: 15px;
}
.work-list {
  list-style: none;
  padding: 0;
  margin: 8px 0 15px;
}
.work-list li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  gap: 10px;
}
.work-list small,
.muted {
  color: var(--muted);
  font-size: 12px;
}
.danger-text {
  color: #8c492b;
}
.surface .control {
  margin: 11px 0;
}
.surface h4 {
  margin: 16px 0 8px;
}
.surface h3,
h3 {
  letter-spacing: -0.4px;
}
.surface p,
.surface li,
details p {
  font-size: 14px;
}
.stack {
  display: grid;
  gap: 8px;
}
.flowsteps {
  padding-left: 20px;
}
.flowsteps li {
  padding: 2px 0;
}
.surface code,
pre,
code {
  font-family: "IBM Plex Mono", Consolas, monospace;
  font-size: 12px;
}
.surface pre,
pre {
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  background: #eff3ed;
  padding: 12px;
  border-radius: 6px;
}
.surface textarea {
  min-height: 200px;
  font: 12px/1.6 monospace;
  word-break: normal;
}
.surface .question-box {
  min-height: 60px;
  font: 14px var(--sans);
}
summary {
  cursor: pointer;
  font-weight: 650;
  color: var(--green);
}
details {
  margin: 13px 0;
}
.guide-contents {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.guide-contents .surface {
  margin: 0;
}
.table-wrap {
  overflow: auto;
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th,
.data-table td {
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
.data-table th {
  background: #edf2eb;
  color: #415e4b;
}
.data-table td {
  min-width: 100px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.chips a {
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.dialog-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 15px;
}
.dialog-top h2 {
  margin: 4px 0;
  font: 700 25px/1.35 var(--serif);
  letter-spacing: -1px;
}
.close-btn {
  padding: 5px;
  line-height: 1;
}
.close-btn .icon {
  width: 22px;
  height: 22px;
}
dialog {
  border: 1px solid #ccdbce;
  border-radius: 12px;
  color: var(--ink);
  padding: 27px;
  max-height: 85vh;
  width: min(820px, 94vw);
  box-shadow: 0 20px 75px #112b2044;
}
dialog::backdrop {
  background: #102d26a4;
}
dialog:has(.compare) {
  width: min(1120px, 95vw);
}
.facts {
  display: grid;
  grid-template-columns: 140px minmax(0, 1fr);
  font-size: 14px;
  line-height: 1.7;
  margin: 15px 0;
}
.facts dt,
.facts dd {
  border-top: 1px solid var(--line);
  padding: 8px 4px;
  margin: 0;
  overflow-wrap: anywhere;
}
.facts dt {
  color: #53685a;
}
.facts a {
  text-decoration: underline;
}
.badge {
  padding: 3px 7px;
  border-radius: 5px;
  background: #eaf0e6;
  color: #3c5a42;
  font-size: 12px;
}
.notice {
  background: #f6f2e8;
  border-left: 3px solid #bd965d;
  padding: 9px 12px;
  font-size: 13px;
  color: #564937;
}
.toast {
  position: fixed;
  z-index: 5;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: #203e33;
  color: white;
  border-radius: 7px;
  padding: 8px 16px;
  max-width: 85vw;
  box-shadow: 0 4px 16px #24362824;
}
.toast:empty {
  display: none;
}
footer.wrap {
  display: flex;
  align-items: center;
  gap: 15px;
  margin-top: 39px;
  border-top: 1px solid var(--line);
  padding: 18px 0 25px;
  font-size: 12px;
  color: var(--muted);
}
footer a {
  margin-left: auto;
}
.foot-brand {
  font-size: 22px;
}
.loading {
  padding: 50px 0;
}
.busy {
  color: #376e50;
  font-weight: 650;
}
.spread {
  justify-content: space-between;
}
.tiny {
  font-size: 12px;
}
.work-output a {
  text-decoration: underline;
  overflow-wrap: anywhere;
}
.work-output td {
  min-width: 65px;
}
.full {
  grid-column: 1/-1;
}

let journalLoad, journalData;
const jf = {
  q: "",
  field: "",
  journal: "",
  year: "",
  level: "",
  method: "",
  packages: false,
  page: 1,
  directory: "",
};
const journalLevels = {
  direct: "본문·코드 직접 확인",
  stated: "초록·재현 설명에 적용 명시",
  clue: "방법명 단서",
  unknown: "미확인",
};
const levelOrder = { direct: 3, stated: 2, clue: 1, unknown: 0 };
const statuses = {
  success: "수집 성공",
  partial: "부분 성공",
  failed: "수집 실패",
};
const num = (n) => Number(n).toLocaleString("ko-KR");
const jnorm = (v) =>
  String(v || "")
    .normalize("NFKC")
    .toLowerCase();
const jpdate = (a) => {
  const values = [a.online, a.issue_date, a.published].filter(Boolean);
  return (
    values
      .filter((v) => !values.some((o) => o !== v && o.startsWith(v)))
      .sort()[0] || ""
  );
};
const jdate = (v) =>
  v
    ? esc(v) + (v.length === 4 ? " (연도)" : v.length === 7 ? " (월)" : "")
    : "미확인";
const jurl = (u, t) =>
  link(typeof u === "string" ? u.replace(/^http:\/\//, "https://") : "", t);
const jbutton = (key, value, label, cls = "jlink") =>
  '<button type="button" class="' +
  cls +
  '" data-jour="' +
  key +
  '" data-value="' +
  esc(value) +
  '">' +

const percent = (a, b) => (b ? ((100 * a) / b).toFixed(1) + "%" : "—");
const eligible = (a) => a.kind !== "notice";

async function jsonResource(name) {
  if (window.POLIHUB_OFFLINE) return window.POLIHUB_OFFLINE[name];
  const r = await fetch("catalog/" + name + ".json");
  if (!r.ok) throw Error(name + " HTTP " + r.status);
  return r.json();
}
async function journalIndex() {
  let bytes;
  const embedded = document.getElementById("journal-data");
  if (embedded) {
    const str = atob(embedded.textContent.trim());
    bytes = Uint8Array.from(str, (c) => c.charCodeAt(0));
  } else {
    const r = await fetch("catalog/journal-index.json.gz");
    if (!r.ok) throw Error("논문 색인 HTTP " + r.status);
    bytes = new Uint8Array(await r.arrayBuffer());
  }
  let stream = new Blob([bytes]).stream();
  if (bytes[0] === 31 && bytes[1] === 139)
    stream = stream.pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).json();
}
async function loadJournal() {
  const [registry, nodes, sources, state] = await Promise.all([
    jsonResource("journals"),
    jsonResource("methods"),
    jsonResource("journal-sources"),
    journalIndex(),
  ]);
  const journals = new Map(registry.journals.map((j) => [j.id, j]));
  const methods = new Map(nodes.map((m) => [m.id, m]));
  const paths = new Map();
  for (const node of nodes) {
    const path = [];
    for (let m = node; m; m = methods.get(m.parent)) path.unshift(m.id);
    paths.set(node.id, path);
  }
  const rows = Object.entries(state.articles)
    .map(([key, a]) => {
      const levels = new Map();
      for (const e of a.methods || []) {
        for (const id of paths.get(e.method) || [])
          levels.set(id, Math.max(levels.get(id) || 0, levelOrder[e.level]));
      }
      const best = Math.max(0, ...levels.values());
      const j = journals.get(a.journal);
      const terms = [...levels.keys()].map((id) =>
        [methods.get(id).label, ...methods.get(id).aliases].join(" "),
      );
      const search = jnorm(
        [
          a.title,
          ...(a.authors || []),
          a.doi,
          ...(a.keywords || []),
          ...terms,
          ...(a.methods || []).map((e) => e.term),
          j.name,
          j.abbr,
          j.field,
        ]
          .filter(Boolean)
          .join(" "),
      );
      return {
        key,
        a,
        j,
        levels,
        best,
        search,
        date: jpdate(a),
        proof: Boolean(
          a.has_abstract ||
          (a.methods || []).some(
            (e) => e.level === "direct" || e.level === "stated",
          ),
        ),
      };
    })
    .sort((x, y) => y.date.localeCompare(x.date) || x.key.localeCompare(y.key));
  return {
    registry,
    journals,
    methods,
    paths,
    sources,
    state,
    rows,
    byKey: new Map(rows.map((r) => [r.key, r])),
  };
}

function methodBars(rows) {
  const d = journalData,
    stats = new Map();
  for (const r of rows.filter((r) => eligible(r.a))) {
    for (const [key, n] of r.levels) {
      const value = stats.get(key) || [0, 0];
      value[n >= 2 ? 0 : 1]++;
      stats.set(key, value);
    }
  }
  const nodes = [...d.methods.values()].filter(
    (m) => (m.parent || "") === (jf.method || ""),
  );
  nodes.sort(
    (x, y) => (stats.get(y.id)?.[0] || 0) - (stats.get(x.id)?.[0] || 0),
  );
  const max = Math.max(
    1,
    ...nodes.map((m) => Math.max(...(stats.get(m.id) || [0, 0]))),
  );
  const bars = nodes
    .map((m) => {
      const [n, c] = stats.get(m.id) || [0, 0];
      return (
        "<li>" +
        jbutton(
          "method",
          m.id,
          esc(m.label) +
            '<span class="jtracks" aria-hidden="true"><i style="width:' +
            (100 * n) / max +
            '%"></i><i style="width:' +
            (100 * c) / max +
            '%"></i></span><span>' +
            num(n) +
            " / " +
            num(c) +
            "</span>",
          "jbar",
        ) +
        "</li>"
      );
    })
    .join("");
  const crumb = [
    "전체 방법",
    ...(d.paths.get(jf.method) || []).map((k) => d.methods.get(k).label),
  ]
    .map(esc)
    .join(" › ");
  return (
    '<section class="surface"><h2>방법별 논문 수</h2><p>' +
    crumb +
    "</p>" +
    (jf.method
      ? jbutton(
          "method",
          d.methods.get(jf.method)?.parent || "",
          "상위 분류로",
        ) +
        " · " +
        jbutton("list", "", "선택한 방법의 논문 보기")
      : "") +
    (bars
      ? '<p class="muted">적용 확인 / 단서만 발견 · 각 분류에서 논문당 한 번 집계</p><ul class="jbars">' +
        bars +
        "</ul>"
      : '<p class="muted">이 방법에 연결된 논문은 아래 목록에서 열 수 있습니다.</p>') +
    "</section>"
  );
}
function trends(base) {
  const years = new Map(),
    months = new Map();
  for (const r of base) {
    const month = r.a.first_seen.slice(0, 7);
    months.set(month, (months.get(month) || 0) + 1);
    if (!eligible(r.a)) continue;
    const y = r.date.slice(0, 4),
      v = years.get(y) || [0, 0, 0, 0];
    const rank = jf.method ? r.levels.get(jf.method) || 0 : r.best;
    v[0]++;
    if (rank >= 2) v[1]++;
    if (rank === 1) v[2]++;
    if (r.proof) v[3]++;
    years.set(y, v);
  }
  const yrows = [...years]
    .sort()
    .map(
      ([y, [n, ap, cl, ev]]) =>
        "<tr><th>" +
        esc(y) +
        "</th><td>" +
        num(n) +
        "</td><td>" +
        num(ap) +
        " / " +
        num(cl) +
        "</td><td>" +
        percent(ap, n) +
        '<meter min="0" max="1" value="' +
        ap / n +
        '"></meter></td><td>' +
        num(ev) +
        " (" +
        percent(ev, n) +
        ")</td></tr>",
    )
    .join("");
  let total = 0;
  const mrows = [...months]
    .sort()
    .map(([m, n]) => {
      total += n;
      return (
        "<tr><th>" +
        esc(m) +
        "</th><td>" +
        num(n) +
        "</td><td>" +
        num(total) +
        "</td></tr>"
      );
    })
    .join("");
  return (
    '<section class="surface"><h2>연도별 방법 적용</h2><p class="muted">분모는 검색·필터 후 서평·정정 등 식별된 비연구물을 뺀 발행 기록입니다. 근거 확보는 초록 또는 적용 근거를 확인한 논문입니다.</p>' +
    '<div class="table-wrap"><table class="data-table"><thead><tr><th>발행연도</th><th>분모</th><th>적용 / 단서</th><th>적용 비중</th><th>근거 확보</th></tr></thead><tbody>' +
    yrows +
    "</tbody></table></div>" +
    '<details><summary>최초 발견월별 누적</summary><table class="data-table"><thead><tr><th>발견월</th><th>신규</th><th>누적</th></tr></thead><tbody>' +
    mrows +
    "</tbody></table></details></section>"
  );
}

      ((a.keywords || []).map((t) => "#" + esc(t)).join(" ") || "미확인") +
      "</p><h3>방법론 근거</h3>" +
      (ev ? "<ul>" + ev + "</ul>" : "<p>미확인</p>") +

async function api(path, body = {}, raw = false) {
  const res = await fetch(path, {
    method: "POST",
    headers: {
      "X-PoliHub": "1",
      ...(!raw ? { "Content-Type": "application/json" } : {}),
    },
    body: raw ? body : JSON.stringify(body),
  });
  const v = await res.json();
  if (!res.ok) throw Error(v.error || "실행기 요청 실패");
  return v;
}

    {

        active.spec.question ||
        active.spec.datasets.map((x) => ds(x.id).name).join(" · "),

    ...history.filter((x) => x.id !== active.id),

async function ensureProject() {
  if (!current()) {
    const v = await api("/api/studies", {
      ids: [...selected],
      question,
      engine,
    });
    active = { ...v, status: null };
    persist();
  }
  return "/api/studies/" + active.id + "/";
}
async function task(action, data) {
  if (busy) return;
  busy = true;
  repaint();
  try {
    const base = await ensureProject();
    if (action === "plan") {
      const v = await api(base + "plan", data);
      Object.assign(active, v);
      question = v.spec.question;
      engine = v.spec.engine;
      save("question", question);
      save("engine", engine);
    } else if (action === "register") {
      const v = await api(base + "register?" + data.params, data.file, true);
      Object.assign(active, v);
    } else {
      if (active.spec.question !== question || active.spec.engine !== engine) {
        active.spec = { ...active.spec, question, engine };
        await api(base + "plan", active.spec);
      }
      const v = await api(base + action);
      Object.assign(active, v);
    }
    persist();
    announce(
      action === "register"
        ? "파일을 등록했습니다."
        : action === "plan"
          ? "연구명세를 저장했습니다."
          : "실행 기록을 저장했습니다.",
    );
  } catch (e) {
    toastError(e);
  } finally {
    busy = false;
    repaint();
  }
}
async function handle(el) {
  const a = el.dataset.action,
    i = el.dataset.id;
  switch (a) {
    case "download-data": {
      const f = C.files[release(ds(i)).files[0]];
      const url = live ? "/api/download/" + encodeURIComponent(f.id) : f.url;
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw Error("HTTP " + resp.status);
        const buf = await resp.arrayBuffer();
        if (buf.byteLength !== f.bytes) throw Error("파일 크기 불일치");
        const hash = [
          ...new Uint8Array(await crypto.subtle.digest("SHA-256", buf)),
        ]
          .map((n) => n.toString(16).padStart(2, "0"))
          .join("");
        if (hash !== f.sha256) throw Error("배포판 해시 불일치");
        const blob = URL.createObjectURL(
          new Blob([buf], { type: "application/octet-stream" }),
        );
        const a = document.createElement("a");
        a.href = blob;
        a.download = f.name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(blob), 1500);
        announce("해시를 확인한 원자료 파일을 내려받습니다.");
      } catch (e) {
        openDialog(
          "원자료 다운로드 확인",
          "<p>브라우저에서 파일을 확인할 수 없습니다. " +
            esc(e.message) +
            "</p>" +
            link(f.url, "공식 배포파일 열기") +
            "<pre>SHA-256 " +
            esc(f.sha256) +
            "</pre>",
        );
      }
      break;
    }
    case "close":
      $("#modal").close();
      break;
    case "detail":
      details(i);
      break;
    case "pick":
      choose(i);
      if ($("#modal").open) details(i);
      break;
    case "region":
      filters.region =
        filters.region === el.dataset.region ? "" : el.dataset.region;
      filterChange();
      break;
    case "category":
      filters.category =
        filters.category === el.dataset.field ? "" : el.dataset.field;
      filterChange();
      break;
    case "filter":
      filterOpen = !filterOpen;
      repaint();
      break;
    case "reset":
      for (let k of Object.keys(filters)) filters[k] = "";
      query = "";
      showAll = false;
      limit = 7;
      repaint();
      break;
    case "all":
      showAll = true;
      limit = 12;
      repaint();
      break;
    case "more":
      limit += 12;
      repaint();
      break;
    case "compare":
      compare();
      break;
    case "spec":
      downloadJSON(
        "study.json",
        current() ? { ...active.spec, question, engine } : makeSpec(),
      );
      break;
    case "pipeline":
    case "run":
      await task(a);
      break;
    case "save-plan":
      await task("plan", JSON.parse($("#plan-edit").value));
      break;
    case "import-nav":
      if (!selected.has(i)) choose(i);
      $("#modal").close();
      location.hash = "work";
      setTimeout(() => {
        if ($("#upload-details")) {
          $("#upload-details").open = true;
          $("#upload-id").value = i;
          $("#upload-details").scrollIntoView();
        }
      }, 25);
      break;
    case "upload": {
      const file = $("#upload").files[0],
        version = $("#upload-version").value.trim();
      if (!file || !version) throw Error("파일과 실제 배포 버전을 입력하세요.");
      const params = new URLSearchParams({
        id: $("#upload-id").value,
        version,
        ext: file.name.split(".").pop(),
        encoding: $("#upload-encoding").value,
      });
      if ($("#upload-member").value)
        params.set("member", $("#upload-member").value);
      await task("register", { params, file });
      break;
    }
    case "restore": {
      const id = el.dataset.project,
        r = await fetch("/api/studies/" + id + "/state");
      if (!r.ok) throw Error("이 실행기에서 프로젝트를 열 수 없습니다.");
      const v = await r.json();
      active = { id, ...v };
      selected = new Set(active.spec.datasets.map((x) => x.id));
      question = active.spec.question;
      engine = active.spec.engine;
      persist();
      save("selection", [...selected]);
      save("question", question);
      save("engine", engine);
      repaint();
      break;
    }
    case "doctor": {
      if (!live) {
        openDialog(
          "환경 확인",
          "<p>현재 화면은 정적 탐색 모드입니다. 연구를 실행할 환경의 터미널에서 진단하세요.</p><pre>python -m polihub doctor</pre>",
        );
        break;
      }
      openDialog(
        "환경 확인",
        '<p role="status">엔진 배치 실행과 네트워크를 확인하고 있습니다.</p>',
      );
      const v = await api("/api/doctor");
      openDialog(
        "연구 실행환경",
        `<dl class="facts"><dt>환경·운영체제</dt><dd>${esc(v.context + " · " + v.os)}</dd><dt>Python</dt><dd>${esc(v.python_version + " · " + v.python)}</dd><dt>Rscript</dt><dd>${esc(v.r.path || "미설치")}<br>${esc((v.r.versions || []).join(" · "))}</dd><dt>Stata 배치</dt><dd>${esc(label(v.stata.status))} ${esc(v.stata.version || v.stata.reason || "")}</dd><dt>저장공간</dt><dd>${(v.disk_free / 2 ** 30).toFixed(1)} GiB · ${v.writable ? "쓰기 가능" : "쓰기 실패"}</dd><dt>인증 설정</dt><dd>MANIFESTO_API_KEY · ${v.credentials.MANIFESTO_API_KEY ? "설정됨" : "미설정"}</dd><dt>네트워크</dt><dd>${v.network.map((x) => esc(x.host) + " · " + (x.status === "reachable" ? "응답 확인" : "접근 실패")).join("<br>")}</dd></dl>`,
      );
      break;
    }
  }
}

          (await (await fetch("/api/capabilities")).json()).execution === true;
      } catch {
        live = false;
      }
    }
    selected = new Set([...selected].filter((i) => ds(i)));
    navigate();
  } catch (e) {
    $("#main").innerHTML =
      '<div class="empty"><h2>카탈로그를 열 수 없습니다.</h2><p>프로젝트 폴더에서 <code>python -m polihub serve</code>를 실행하거나 독립 실행 HTML을 여세요.</p></div>';
  }
})();
</script></body>
